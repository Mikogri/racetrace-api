name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore racetrace-api.slnx
      - run: dotnet test racetrace-api.Tests -c Release --no-restore
      - run: dotnet publish racetrace-api/racetrace-api.csproj -c Release --no-restore -o /tmp/publish
      - run: docker build -t racetrace-api:check .
